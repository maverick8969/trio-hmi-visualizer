<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trio HMI Screen Visualizer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Segoe UI", Arial, sans-serif; background: #1e1e2e; color: #cdd6f4; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* Toolbar */
#toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: #313244; border-bottom: 1px solid #45475a; flex-shrink: 0; }
#toolbar button, #toolbar label { padding: 6px 14px; border: 1px solid #585b70; border-radius: 4px; background: #45475a; color: #cdd6f4; cursor: pointer; font-size: 13px; white-space: nowrap; }
#toolbar button:hover, #toolbar label:hover { background: #585b70; }
#toolbar .separator { width: 1px; height: 24px; background: #585b70; margin: 0 4px; }
#toolbar .mode-btn.active { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }
#toolbar input[type="file"] { display: none; }

/* Tab bar */
#tabbar { display: flex; gap: 2px; padding: 4px 12px 0; background: #313244; flex-shrink: 0; overflow-x: auto; }
#tabbar .tab { padding: 6px 16px; border-radius: 6px 6px 0 0; background: #45475a; color: #a6adc8; cursor: pointer; font-size: 13px; border: 1px solid #585b70; border-bottom: none; white-space: nowrap; }
#tabbar .tab.active { background: #1e1e2e; color: #89b4fa; border-color: #89b4fa; }
#tabbar .tab:hover:not(.active) { background: #585b70; }

/* Main area */
#main { display: flex; flex: 1; overflow: hidden; }

/* Component list (editor mode) */
#comp-list { width: 200px; background: #181825; border-right: 1px solid #45475a; overflow-y: auto; display: none; flex-shrink: 0; }
#comp-list.visible { display: block; }
#comp-list h3 { padding: 8px; font-size: 12px; color: #a6adc8; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #313244; }
#comp-list .comp-item { padding: 4px 8px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #313244; display: flex; align-items: center; gap: 6px; }
#comp-list .comp-item:hover { background: #313244; }
#comp-list .comp-item.selected { background: #45475a; color: #89b4fa; }
#comp-list .comp-type { color: #a6adc8; font-size: 10px; }

/* Canvas area */
#canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; background: #11111b; position: relative; padding: 10px; }
#canvas-wrapper { flex-shrink: 0; position: relative; width: 1024px; height: 600px; }
#hmi-canvas { position: relative; width: 1024px; height: 600px; overflow: hidden; background: #F0F0F0; box-shadow: 0 2px 16px rgba(0,0,0,0.5); }

/* Right panel */
#right-panel { width: 300px; background: #181825; border-left: 1px solid #45475a; display: flex; flex-direction: column; flex-shrink: 0; }
#right-panel .panel-header { padding: 8px; font-size: 12px; color: #a6adc8; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #313244; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
#right-panel .panel-header:hover { background: #313244; }

/* Property panel */
#prop-panel { flex: 1; overflow-y: auto; display: none; }
#prop-panel.visible { display: block; }
#prop-panel .prop-row { display: flex; padding: 3px 8px; border-bottom: 1px solid #313244; align-items: center; font-size: 12px; }
#prop-panel .prop-name { width: 100px; color: #a6adc8; flex-shrink: 0; }
#prop-panel .prop-value { flex: 1; }
#prop-panel .prop-value input, #prop-panel .prop-value select { width: 100%; background: #313244; border: 1px solid #45475a; color: #cdd6f4; padding: 2px 4px; border-radius: 3px; font-size: 12px; }
#prop-panel .prop-binding { color: #f9e2af; font-size: 10px; margin-top: 1px; }

/* VR Simulation panel */
#vr-panel { flex: 1; overflow-y: auto; }
#vr-panel .vr-row { display: flex; padding: 2px 8px; border-bottom: 1px solid #313244; align-items: center; font-size: 12px; gap: 4px; }
#vr-panel .vr-label { width: 70px; color: #a6adc8; flex-shrink: 0; font-family: monospace; }
#vr-panel .vr-input { width: 70px; background: #313244; border: 1px solid #45475a; color: #cdd6f4; padding: 2px 4px; border-radius: 3px; font-size: 12px; font-family: monospace; }
#vr-panel .vr-desc { flex: 1; color: #585b70; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#vr-filter { width: calc(100% - 16px); margin: 4px 8px; background: #313244; border: 1px solid #45475a; color: #cdd6f4; padding: 4px 8px; border-radius: 3px; font-size: 12px; }

/* Status bar */
#statusbar { padding: 4px 12px; background: #313244; border-top: 1px solid #45475a; font-size: 12px; color: #a6adc8; display: flex; gap: 16px; flex-shrink: 0; }

/* HMI Component styles */
.hmi-component { position: absolute; overflow: hidden; }
.hmi-label { display: flex; user-select: none; }
.hmi-textbox { border: 1px solid #A0A0A0; background: #FFFFFF; display: flex; align-items: center; padding: 0 4px; }
.hmi-button { border: 2px outset #D0D0D0; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; text-align: center; }
.hmi-button:active { border-style: inset; }
.hmi-checkbox { display: flex; align-items: flex-start; gap: 4px; cursor: pointer; user-select: none; }
.hmi-checkbox .cb-box { width: 18px; height: 18px; border: 1px solid #888; background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.hmi-checkbox .cb-box.checked::after { content: "\2713"; color: #000; font-size: 14px; }
.hmi-picturebox { display: flex; align-items: center; justify-content: center; }
.hmi-picturebox img { max-width: 100%; max-height: 100%; }
.hmi-picturebox img.smart-stretch { width: 100%; height: 100%; object-fit: contain; }
.hmi-rectangle { }
.hmi-line { }
.hmi-datagrid { overflow: auto; font-size: 14px; }
.hmi-datagrid table { border-collapse: collapse; width: 100%; }
.hmi-datagrid th { text-align: left; padding: 4px 6px; border: 1px solid #A0A0A0; }
.hmi-datagrid td { padding: 4px 6px; border: 1px solid #A0A0A0; }
.hmi-datagrid tr.selected td { background: #0078D7; color: #fff; }

/* Editor overlays */
.editor-selection { position: absolute; border: 2px dashed #89b4fa; pointer-events: none; z-index: 9000; }
.resize-handle { position: absolute; width: 8px; height: 8px; background: #89b4fa; border: 1px solid #1e1e2e; z-index: 9001; cursor: pointer; }

/* Virtual Keypad */
#keypad-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 10000; }
#keypad-overlay.visible { display: flex; }
#keypad { background: #F0F0F0; border: 2px solid #888; padding: 8px; border-radius: 4px; }
#keypad-display { width: 240px; height: 40px; font-size: 24px; text-align: right; padding: 4px 8px; margin-bottom: 8px; border: 1px solid #888; background: #fff; }
#keypad .kp-row { display: flex; gap: 4px; margin-bottom: 4px; }
#keypad .kp-btn { width: 56px; height: 56px; font-size: 20px; border: 1px solid #888; background: #E0E0E0; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 3px; }
#keypad .kp-btn:hover { background: #D0D0D0; }
#keypad .kp-btn.enter { background: #90EE90; }
#keypad .kp-btn.cancel { background: #F08080; }

/* Component palette (editor mode) */
#palette { display: none; padding: 4px 12px; background: #313244; border-bottom: 1px solid #45475a; gap: 4px; flex-shrink: 0; overflow-x: auto; }
#palette.visible { display: flex; }
#palette .palette-item { padding: 4px 10px; background: #45475a; border: 1px solid #585b70; border-radius: 3px; font-size: 11px; cursor: grab; white-space: nowrap; color: #cdd6f4; }
#palette .palette-item:hover { background: #585b70; }

/* Drop zone overlay */
#drop-zone { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(137,180,250,0.15); border: 3px dashed #89b4fa; display: none; align-items: center; justify-content: center; z-index: 9999; font-size: 24px; color: #89b4fa; pointer-events: none; }
#drop-zone.visible { display: flex; }
</style>
<link rel="stylesheet" href="js/sim/sim.css">
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <label for="file-input">Load Files</label>
  <input type="file" id="file-input" multiple accept=".tgd,.tgm,.TGD,.TGM,.png,.PNG">
  <label for="folder-input">Load Folder</label>
  <input type="file" id="folder-input" webkitdirectory multiple>
  <div class="separator"></div>
  <button class="mode-btn active" data-mode="view">View</button>
  <button class="mode-btn" data-mode="edit">Edit</button>
  <div class="separator"></div>
  <button id="btn-export">Export TGD</button>
  <button id="btn-export-all">Export All</button>
  <div class="separator"></div>
  <button id="btn-zoom-out">-</button>
  <span id="zoom-label" style="font-size:12px;min-width:70px;text-align:center;">Zoom: 100%</span>
  <button id="btn-zoom-in">+</button>
  <button id="btn-zoom-fit">Fit</button>
  <button id="btn-zoom-100">1:1</button>
</div>

<!-- Component palette (editor mode) -->
<div id="palette">
  <span style="font-size:11px;color:#a6adc8;padding:4px;">Add:</span>
  <div class="palette-item" data-type="TVBLabel">Label</div>
  <div class="palette-item" data-type="TVBTextBox">TextBox</div>
  <div class="palette-item" data-type="TVBButton">Button</div>
  <div class="palette-item" data-type="TVBCheckBox">CheckBox</div>
  <div class="palette-item" data-type="TVBRectangle">Rectangle</div>
  <div class="palette-item" data-type="TVBLine">Line</div>
  <div class="palette-item" data-type="TVBPictureBox">PictureBox</div>
</div>

<!-- Tab bar -->
<div id="tabbar"></div>

<!-- Main area -->
<div id="main">
  <!-- Component list (editor) -->
  <div id="comp-list">
    <h3>Components</h3>
    <div id="comp-list-items"></div>
  </div>

  <!-- Canvas -->
  <div id="canvas-area">
    <div id="canvas-wrapper">
      <div id="hmi-canvas"></div>
    </div>
  </div>

  <!-- Right panel -->
  <div id="right-panel">
    <div class="panel-header" data-panel="prop-panel">Properties <span>&#9660;</span></div>
    <div id="prop-panel">
      <div style="padding:12px;color:#585b70;font-size:12px;">Select a component to edit properties</div>
    </div>
    <div class="panel-header" data-panel="vr-panel">VR Simulation <span>&#9660;</span></div>
    <div id="vr-panel">
      <input type="text" id="vr-filter" placeholder="Filter VR registers...">
      <div id="vr-list"></div>
    </div>
  </div>
</div>

<!-- Status bar -->
<div id="statusbar">
  <span id="status-page">No page loaded</span>
  <span id="status-components">Components: 0</span>
  <span id="status-zoom">Zoom: 100%</span>
</div>

<!-- Virtual keypad overlay -->
<div id="keypad-overlay">
  <div id="keypad">
    <input type="text" id="keypad-display" value="">
    <div class="kp-row">
      <div class="kp-btn" data-key="7">7</div>
      <div class="kp-btn" data-key="8">8</div>
      <div class="kp-btn" data-key="9">9</div>
      <div class="kp-btn" data-key="bksp">&#9003;</div>
    </div>
    <div class="kp-row">
      <div class="kp-btn" data-key="4">4</div>
      <div class="kp-btn" data-key="5">5</div>
      <div class="kp-btn" data-key="6">6</div>
      <div class="kp-btn" data-key="clear">C</div>
    </div>
    <div class="kp-row">
      <div class="kp-btn" data-key="1">1</div>
      <div class="kp-btn" data-key="2">2</div>
      <div class="kp-btn" data-key="3">3</div>
      <div class="kp-btn cancel" data-key="cancel">Esc</div>
    </div>
    <div class="kp-row">
      <div class="kp-btn" data-key="sign">+/-</div>
      <div class="kp-btn" data-key="0">0</div>
      <div class="kp-btn" data-key=".">.</div>
      <div class="kp-btn enter" data-key="enter">OK</div>
    </div>
  </div>
</div>

<!-- Drop zone -->
<div id="drop-zone">Drop .TGD, .TGM, and image files here</div>

<!-- JavaScript modules -->
<script src="js/utils.js"></script>
<script src="js/vr-store.js"></script>
<script src="js/tgd-parser.js"></script>
<script src="js/tgm-parser.js"></script>
<script src="js/binding-engine.js"></script>
<script src="js/image-store.js"></script>
<script src="js/renderers.js"></script>
<script src="js/action-handler.js"></script>
<script src="js/editor.js"></script>
<script src="js/serializer.js"></script>
<script src="js/app.js"></script>

<!-- Trio simulator engine + dashboard -->
<script src="js/sim/trio-lexer.js"></script>
<script src="js/sim/trio-parser.js"></script>
<script src="js/sim/trio-runtime.js"></script>
<script src="js/sim/trio-machine.js"></script>
<script src="js/sim/trio-plant.js"></script>
<script src="js/sim/sim-controller.js"></script>
<script src="js/sim/sim-ui.js"></script>
</body>
</html>
